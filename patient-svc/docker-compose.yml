# Runs patient-svc ALONE against the existing Postgres container (graphgpt-postgres), for development.
# The container is external: it must already be attached to nephro-net with the alias "postgres"
# (same setup as auth-svc, see ../auth-svc/README.md). Compose does not start a database.
services:
  patient-svc:
    build:
      context: .
    image: nephro/patient-svc
    env_file: .env
    environment:
      PATIENT_DATABASE_URL: postgresql+asyncpg://patient_svc:${PATIENT_DB_PW}@postgres:5432/${PATIENT_DB_NAME:-nephro_patient_db}
    networks: [nephro-net]
    mem_limit: 512m
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
    # No "ports": patient-svc is never published. Only the gateway publishes a port.

networks:
  nephro-net:
    external: true     # the existing Postgres container (and auth-svc) are attached to it
