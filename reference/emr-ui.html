<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NephroCare EMR - Prototype</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e6b75'/%3E%3Cpath d='M6 17h5l3-8 4 14 3-6h5' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f7;--surface:#fff;--line:#e1e7ea;--line-2:#cdd6db;
  --ink:#10202b;--ink-2:#3d5260;--ink-3:#6b7f8c;
  --teal:#0e6b75;--teal-700:#0a555d;--teal-50:#e6f3f4;--teal-100:#cde7ea;
  --nav:#0c2a31;--nav-2:#143b44;--nav-ink:#a9c4ca;
  --ai:#5b3fd1;--ai-50:#f0edfc;--ai-100:#ded7f8;
  --ok:#12805c;--ok-50:#e5f5ee;--warn:#a86400;--warn-50:#fff3dc;--bad:#be2f3b;--bad-50:#fcebed;--info:#1560a8;--info-50:#e6f0fa;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--teal);text-decoration:none}a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0;line-height:1.25;font-weight:600}
h1{font-size:22px;letter-spacing:-.01em}h2{font-size:16px}h3{font-size:14px}
p{margin:0}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
.ic{flex:none;vertical-align:middle}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}.small{font-size:12.5px}.nowrap{white-space:nowrap}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:4px}

/* shell */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.sidebar{background:var(--nav);color:var(--nav-ink);padding:18px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;color:#fff;padding:4px 8px 22px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--teal);display:grid;place-items:center;color:#fff}
.brand b{display:block;font-size:15px;letter-spacing:-.005em}.brand small{display:block;font-size:12px;color:var(--nav-ink)}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--nav-ink);font-weight:500;margin-bottom:2px}
.nav-item:hover{background:var(--nav-2);color:#fff;text-decoration:none}
.nav-item.active{background:var(--nav-2);color:#fff;box-shadow:inset 3px 0 0 #5fc4cf}
.side-foot{margin-top:auto;padding:10px}
.sim-note{display:flex;gap:8px;font-size:12px;line-height:1.45;color:#8fb0b7;border-top:1px solid #1c4953;padding-top:12px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:10px 24px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.gsearch{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:0 10px;width:min(380px,100%);height:36px;color:var(--ink-3)}
.gsearch input{border:0;background:transparent;outline:none;flex:1;height:34px}
.gsearch:focus-within{border-color:var(--teal);background:#fff}
.mnav{display:none;gap:12px}
.pills{display:flex;gap:6px;margin-left:auto}
.svc-pill{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);padding:3px 9px;border:1px solid var(--line);border-radius:999px;background:#fff}
.svc-pill i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.svc-pill.busy{border-color:var(--teal);color:var(--teal-700);background:var(--teal-50)}
.svc-pill.busy i{background:var(--teal);animation:pulse .7s infinite alternate}
@keyframes pulse{from{opacity:.35}to{opacity:1}}
.user-menu{position:relative}
.user-btn{display:flex;align-items:center;gap:9px;background:none;border:0;padding:3px 6px;border-radius:8px}
.user-btn:hover{background:var(--bg)}
.user-btn .who{text-align:left;line-height:1.2}.user-btn .who b{display:block;font-size:13px}.user-btn .who span{font-size:12px;color:var(--ink-3)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--teal-100);color:var(--teal-700);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.avatar.lg{width:44px;height:44px;font-size:15px}
.menu{position:absolute;right:0;top:44px;background:#fff;border:1px solid var(--line);border-radius:10px;min-width:230px;box-shadow:0 10px 30px rgba(12,42,49,.15);padding:6px;display:none;z-index:40}
.menu.open{display:block}
.menu .m-head{padding:8px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu button,.menu a{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;color:var(--ink);font-size:13.5px}
.menu button:hover,.menu a:hover{background:var(--bg);text-decoration:none}
.view{padding:24px;max-width:1360px;width:100%}

/* page structure */
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-h p{color:var(--ink-3);margin-top:3px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0;overflow-x:auto}.grid>*{min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.panel-h h2,.panel-h h3{display:flex;align-items:center;gap:8px}
.panel-b{padding:16px}
.panel-b.flush{padding:0}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:16px}
.kpi{padding:14px 16px;border-right:1px solid var(--line)}.kpi:last-child{border-right:0}
.kpi .n{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.kpi .l{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.kpi.hot .n{color:var(--bad)}.user-menu{margin-left:auto}

/* buttons & forms */
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line-2);background:#fff;color:var(--ink);font-weight:500;font-size:13.5px;white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn.primary:hover{background:var(--teal-700)}
.btn.ai{background:var(--ai);border-color:var(--ai);color:#fff}.btn.ai:hover{background:#4a31b5}
.btn.danger{color:var(--bad);border-color:#e5b9be}.btn.danger:hover{background:var(--bad-50)}
.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:var(--bg)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.loading{pointer-events:none;opacity:.8}
.icon-btn{width:30px;height:30px;display:inline-grid;place-items:center;border:0;background:transparent;border-radius:6px;color:var(--ink-2)}
.icon-btn:hover{background:var(--bg)}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;min-width:0}
.fld-l{font-weight:500;font-size:13px;color:var(--ink-2)}.req{color:var(--bad);margin-left:2px}
.fld input,.fld select,.fld textarea,.inp{width:100%;border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;background:#fff;min-height:36px}
.fld textarea{resize:vertical;min-height:70px;line-height:1.45}
.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-50)}
.fld .invalid{border-color:var(--bad)}
.hint{font-size:12px;color:var(--ink-3)}.err{font-size:12px;color:var(--bad);min-height:0}
.inp.sm{min-height:32px;padding:5px 9px;width:auto}
.f-row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.form-actions{display:flex;justify-content:flex-end;gap:8px;padding-top:14px;border-top:1px solid var(--line);margin-top:6px}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px}.chk input{width:16px;height:16px}
.switch{position:relative;width:38px;height:22px;display:inline-block;flex:none}
.switch input{opacity:0;width:0;height:0}.switch span{position:absolute;inset:0;background:var(--line-2);border-radius:999px;transition:.15s}
.switch span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked+span{background:var(--teal)}.switch input:checked+span:before{transform:translateX(16px)}
.switch input:disabled+span{opacity:.5}

/* chips, alerts */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;background:var(--bg);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--ok-50);color:var(--ok);border-color:#bfe5d3}
.chip.warn{background:var(--warn-50);color:var(--warn);border-color:#f0d9a6}
.chip.danger{background:var(--bad-50);color:var(--bad);border-color:#f0c2c7}
.chip.info{background:var(--info-50);color:var(--info);border-color:#bcd6ee}
.chip.teal{background:var(--teal-50);color:var(--teal-700);border-color:var(--teal-100)}
.chip.ai{background:var(--ai-50);color:var(--ai);border-color:var(--ai-100)}
.chip.ref{cursor:pointer;font-size:12px;background:#fff;color:var(--ai);border-color:var(--ai-100)}
.chip.ref:hover{background:var(--ai-50)}
.chip button{border:0;background:none;padding:0 0 0 2px;color:inherit;font-size:14px;line-height:1}
.alert{display:flex;gap:10px;padding:11px 14px;border-radius:8px;border:1px solid;font-size:13.5px;align-items:flex-start}
.alert.warn{background:var(--warn-50);border-color:#f0d9a6;color:#6e4400}
.alert.danger{background:var(--bad-50);border-color:#f0c2c7;color:#80202a}
.alert.info{background:var(--info-50);border-color:#bcd6ee;color:#0f4478}
.alert.ok{background:var(--ok-50);border-color:#bfe5d3;color:#0c5c42}
.alert .ic{margin-top:2px}

/* tables */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:500;font-size:12.5px;color:var(--ink-3);padding:9px 14px;border-bottom:1px solid var(--line);background:#fafcfc;white-space:nowrap}
th.sortable{cursor:pointer}th.sortable:hover{color:var(--ink)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:#f8fbfb}
td.num,th.num{text-align:right}
.cell-name{display:flex;align-items:center;gap:10px}
.cell-name b{display:block;font-weight:600}.cell-name span{font-size:12.5px;color:var(--ink-3)}
.empty{padding:36px 20px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.pager{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.toolbar .search{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:8px;padding:0 10px;height:36px;flex:1;min-width:220px;max-width:420px;color:var(--ink-3)}
.toolbar .search input{border:0;outline:none;flex:1;height:34px;background:transparent}
.toolbar .search:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-50)}

/* patient header + tabs */
.crumbs{font-size:13px;color:var(--ink-3);margin-bottom:10px}
.pt-head{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.pt-id{display:flex;gap:14px;align-items:center}
.pt-id h1{margin-bottom:5px}
.pt-meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line-2);margin-bottom:18px;overflow-x:auto}
.tab{padding:10px 14px;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--ink);text-decoration:none;background:#eef3f4;border-radius:6px 6px 0 0}
.tab.active{color:var(--teal-700);border-bottom-color:var(--teal)}
.tab .ct{font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--ink-3)}
.tab.ai-tab.active{color:var(--ai);border-bottom-color:var(--ai)}
.dl{display:grid;grid-template-columns:150px 1fr;gap:9px 14px;margin:0}
.dl dt{color:var(--ink-3)}.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.nd{color:var(--ink-3);font-style:italic}
.list-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.sect-label{padding:9px 16px;background:#fafcfc;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink-2)}

/* labs */
.ckd-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:14px}
.ckd-cell{padding:14px 16px;border-right:1px solid var(--line)}.ckd-cell:last-child{border-right:0}
.ckd-cell .t{font-size:12.5px;color:var(--ink-3)}
.ckd-cell .v{font-size:24px;font-weight:600;letter-spacing:-.02em;margin:3px 0}
.latest-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:14px;overflow:hidden}
.lt{padding:12px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.lt:nth-child(4n){border-right:0}.lt:nth-last-child(-n+4){border-bottom:0}
.lt .t{font-size:12.5px;color:var(--ink-3);display:flex;justify-content:space-between;gap:6px}
.lt .v{font-family:var(--mono);font-size:21px;font-weight:500;margin:4px 0 2px}.lt .v small{font-size:12px;color:var(--ink-3);font-family:var(--font)}
.lt.abn{background:#fffaf0}.lt.crit{background:#fff5f6}
.chart-wrap{padding:10px 14px 14px}
.chart-wrap svg{width:100%;height:auto;display:block;overflow:visible}
.ax text{font-size:11px;fill:var(--ink-3);font-family:var(--font)}
.grid-l{stroke:#e6ecef;stroke-width:1}
.band{fill:#e5f5ee;opacity:.75}
.stage-l{stroke:#b8c6cd;stroke-dasharray:3 4;stroke-width:1}
.stage-t{font-size:10.5px;fill:#6b7f8c}
.series{fill:none;stroke:var(--teal);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.pt{stroke:#fff;stroke-width:2;cursor:pointer}
.xhair{stroke:#9fb0b8;stroke-width:1;stroke-dasharray:3 3;opacity:0;pointer-events:none}
.stat-row{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 14px}
#tooltip{position:fixed;z-index:200;pointer-events:none;background:#10202b;color:#fff;font-size:12.5px;padding:7px 10px;border-radius:8px;line-height:1.4;opacity:0;transition:opacity .08s;max-width:260px}
#tooltip.show{opacity:1}

/* ai */
.ai-panel{border:1px solid var(--ai-100);border-left:4px solid var(--ai);border-radius:10px;background:linear-gradient(0deg,#fff,#fff);}
.ai-banner{display:flex;align-items:center;gap:10px;background:var(--ai-50);padding:10px 16px;border-bottom:1px solid var(--ai-100);color:var(--ai);font-weight:600;border-radius:0 9px 0 0}
.ai-sec{padding:14px 16px;border-bottom:1px dashed var(--ai-100)}.ai-sec:last-of-type{border-bottom:0}
.ai-sec h3{margin-bottom:6px;color:#2f2268}
.ai-sec p{line-height:1.6;max-width:78ch}
.refs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.disclaimer{display:flex;gap:10px;padding:12px 16px;background:#faf9ff;border-top:1px solid var(--ai-100);font-size:13px;color:#3a2f78;border-radius:0 0 9px 0}
.fu{padding:10px 0;border-bottom:1px solid #eee9fb}.fu:last-child{border-bottom:0}
.fu b{display:block;font-weight:600}.fu span{color:var(--ink-2);font-size:13px}
.steps{list-style:none;margin:0;padding:6px 0}
.step{display:flex;gap:12px;padding:10px 16px;align-items:flex-start}
.step .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;flex:none;margin-top:1px;color:#fff;background:#fff}
.step.active .dot{border-color:var(--ai);border-top-color:transparent;animation:spin .8s linear infinite}
.step.done .dot{background:var(--ok);border-color:var(--ok)}.step.failed .dot{background:var(--bad);border-color:var(--bad)}
.step.warn .dot{background:var(--warn);border-color:var(--warn)}.step.skipped .dot{background:var(--bg)}
.step .t{font-weight:500}.step .d{font-size:12.5px;color:var(--ink-3)}.step .ms{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-3)}
@keyframes spin{to{transform:rotate(360deg)}}
details.fold{border-top:1px solid var(--line)}
details.fold summary{padding:11px 16px;cursor:pointer;font-weight:500;color:var(--ink-2);list-style:none;display:flex;align-items:center;gap:8px}
details.fold summary::-webkit-details-marker{display:none}
details.fold[open] summary{border-bottom:1px solid var(--line)}
pre.code{margin:0;padding:14px 16px;background:#0f1d24;color:#d6e6ea;font-family:var(--mono);font-size:12px;overflow:auto;max-height:340px;line-height:1.55}

/* modal, toast, net */
.backdrop{position:fixed;inset:0;background:rgba(10,28,34,.5);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto;z-index:100}
.modal{background:#fff;border-radius:12px;width:100%;max-width:560px;box-shadow:0 24px 70px rgba(10,28,34,.35)}
.modal.lg{max-width:860px}.modal.sm{max-width:420px}
.modal-h{display:flex;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h p{color:var(--ink-3);font-size:13px;margin-top:2px}
.modal-b{padding:18px 20px 20px}
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:300}
.toast{background:#10202b;color:#fff;padding:10px 14px;border-radius:8px;font-size:13.5px;display:flex;gap:9px;align-items:center;min-width:240px;max-width:380px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .18s ease-out}
.toast.ok .ic{color:#6ee0b2}.toast.err .ic{color:#ff8e98}.toast.info .ic{color:#8fd3ff}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.net{position:fixed;left:240px;right:0;bottom:0;background:#fff;border-top:1px solid var(--line-2);box-shadow:0 -10px 30px rgba(12,42,49,.12);z-index:60;display:none;max-height:42vh;flex-direction:column}
.net.open{display:flex}
.net-h{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line)}
.net-h .sp{margin-left:auto}
.net-b{overflow:auto}
.net table td,.net table th{padding:6px 12px;font-size:12.5px}
.dx-row{display:grid;grid-template-columns:110px 1fr auto auto;gap:8px;align-items:center;margin-bottom:8px}
.sym-box{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.vit{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.vit-tile{border:1px solid var(--line);border-radius:8px;padding:9px 11px}.vit-tile .t{font-size:12px;color:var(--ink-3)}.vit-tile .v{font-family:var(--mono);font-size:17px}

/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(380px,1.05fr) minmax(420px,1fr)}
.auth-art{background:var(--nav);color:#d3e4e8;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-art h1{font-size:34px;line-height:1.15;color:#fff;max-width:14ch;letter-spacing:-.02em}
.auth-art ul{list-style:none;margin:26px 0 0;padding:0;display:grid;gap:14px;max-width:44ch}
.auth-art li{display:flex;gap:12px;color:#b6ced3}.auth-art li b{color:#fff;display:block;font-weight:600}
.trace{position:absolute;right:-40px;bottom:30px;width:420px;opacity:.5}
.auth-form{display:grid;place-items:center;padding:32px}
.auth-card{width:100%;max-width:400px}
.auth-card h2{font-size:22px;margin-bottom:6px}
.seg{display:flex;border:1px solid var(--line-2);border-radius:8px;padding:3px;margin-bottom:20px;background:#fff}
.seg a{flex:1;text-align:center;padding:7px;border-radius:6px;color:var(--ink-2);font-weight:500}.seg a.on{background:var(--teal);color:#fff}.seg a:hover{text-decoration:none}
.pw-rules{display:grid;gap:3px;font-size:12px;color:var(--ink-3);margin:-4px 0 14px}.pw-rules .ok{color:var(--ok)}
.demo-box{margin-top:18px;border:1px dashed var(--line-2);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--ink-2)}

/* architecture */
.flow-svg{width:100%;height:auto;display:block}
.node rect{fill:#fff;stroke:#b6c5cc;stroke-width:1.4}
.node.gw rect{fill:#e8f2f3;stroke:var(--teal)}.node.db rect{fill:#f4f7f8}.node.ext rect{fill:#f5f2fd;stroke:#b8aaec}
.node text.nt{font-size:14px;font-weight:600;fill:var(--ink)}.node text.ns{font-size:11.5px;fill:var(--ink-3)}
.node.active rect{stroke:var(--teal);stroke-width:2.6;fill:var(--teal-50)}.node.ext.active rect{stroke:var(--ai);fill:var(--ai-50)}
.edge{fill:none;stroke:#a5b4bc;stroke-width:1.6}.edge.dash{stroke-dasharray:5 4}.edge.on{stroke:var(--teal);stroke-width:2.8}.edge.dash.ai-e{stroke:#8f7ae0}
.jr{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.jr button{border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:6px 13px;font-weight:500;color:var(--ink-2)}
.jr button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.jstep{display:flex;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.jstep:last-child{border-bottom:0}.jstep.on{background:var(--teal-50)}
.jstep .n{width:24px;height:24px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.jstep.on .n{background:var(--teal);color:#fff}
.decision{padding:14px 16px;border-bottom:1px solid var(--line)}.decision:last-child{border-bottom:0}
.decision b{display:block;margin-bottom:2px}.decision p{color:var(--ink-2);font-size:13.5px}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,#eef2f4,#f7f9fa,#eef2f4);background-size:200% 100%;animation:sk 1.1s infinite}
@keyframes sk{to{background-position:-200% 0}}

@media(max-width:1100px){.g4,.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.g-main,.g3{grid-template-columns:1fr}.latest-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.lt:nth-child(4n){border-right:1px solid var(--line)}.lt:nth-child(2n){border-right:0}}
@media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{display:none}.mnav{display:flex}.net{left:0}.g2{grid-template-columns:1fr}.auth{grid-template-columns:1fr}.auth-art{display:none}.pills{display:none}.ckd-grid{grid-template-columns:1fr}.vit{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.demo-opt{margin-top:18px;font-size:12.5px;color:var(--ink-3)}.demo-opt summary{cursor:pointer;padding:6px 0;width:max-content}
.demo-opt>div{border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:6px;max-width:460px}
.kf-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:2px}
.ckd-strip{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.ckd-strip .k{font-size:12px;color:var(--ink-3);margin-bottom:3px}
.spark{display:block}
.hbar{display:grid;grid-template-columns:150px 1fr 26px;gap:10px;align-items:center;padding:5px 0;font-size:13px}
.hbar .track{height:16px;background:var(--bg);border-radius:4px;overflow:hidden}.hbar .fill{height:100%;border-radius:0 4px 4px 0}
.hbar .ct{text-align:right;font-weight:600}
.att-item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.att-item:last-child{border-bottom:0}.att-item .why{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.clinic{padding:12px;border-radius:10px;background:var(--nav-2);color:#fff;font-size:13px}.clinic small{display:block;color:var(--nav-ink);font-size:12px;margin-top:2px}
.greet{font-size:24px;letter-spacing:-.01em}
tr.click-row{cursor:pointer}tr.click-row:hover td{background:var(--bg)}
</style>

/* ================= clinical domain (pure functions) ================= */
const LAB_TESTS={

function ckdEpi(scr,age,sex){const k=sex==='F'?0.7:0.9,a=sex==='F'?-0.241:-0.302;return 142*Math.pow(Math.min(scr/k,1),a)*Math.pow(Math.max(scr/k,1),-1.2)*Math.pow(0.9938,age)*(sex==='F'?1.012:1)}

function trendStats(pts,test){
  const n=pts.length;if(!n)return{n:0,direction:'no_data',pts:[]};
  const first=pts[0],last=pts[n-1],abs=last.v-first.v,pct=first.v?abs/first.v*100:0,spanDays=Math.round((last.t-first.t)/DAY);
  let slope=null,direction='insufficient_data',rapid=false;
  if(n>=3){
    const xs=pts.map(p=>(p.t-first.t)/(365.25*DAY)),ys=pts.map(p=>p.v),mx=avg(xs),my=avg(ys);let nu=0,de=0;
    xs.forEach((x,i)=>{nu+=(x-mx)*(ys[i]-my);de+=(x-mx)*(x-mx)});slope=de?nu/de:0;
    if(test==='EGFR'){direction=slope<=-2?'worsening':slope>=2?'improving':'stable';rapid=slope<=-5}
    else direction=slope>0.1?'worsening':slope<-0.1?'improving':'stable';
  }
  return{n,first:first.v,last:last.v,abs,pct,slope,direction,rapid,spanDays,pts};
}
const dirChip=s=>!s.n?chip('No data'):s.direction==='insufficient_data'?chip('Insufficient data (needs 3+ results)','warn'):s.direction==='worsening'?chip('Worsening','danger','dn'):s.direction==='improving'?chip('Improving','ok','up'):chip('Stable','');

const SPECS=[

 pmh:'Type 2 diabetes for 18 years. Hypertension for 15 years. Diabetic retinopathy treated with laser in 2022.',fh:'Father had end-stage kidney disease.',sh:'Retired bank manager. Non-smoker. No alcohol.',

function seedDb(){
  const rnd=mulberry32(42),now=Date.now();
  const db={v:1,users:[],patients:[],conditions:[],meds:[],allergies:[],encounters:[],labReports:[],labResults:[],aiSummaries:[],audit:[],
    config:{provider:'mock',toolsEnabled:true,maxToolIterations:4,signupEnabled:true,dailyQuota:50}};
  const mkUser=(name,email,role,pw)=>({id:uid(),name,email,role,hash:'argon2id$'+hash53(email+pw),active:true,failed:0,lockedUntil:0,lastLogin:null,createdAt:new Date(now-90*DAY).toISOString()});
  db.users.push(mkUser('Dr. Anita Rao','dr.rao@nephrocare.demo','clinician','Nephro#2026'),mkUser('Dr. Karan Malhotra','dr.malhotra@nephrocare.demo','clinician','Nephro#2026'),mkUser('System Admin','admin@nephrocare.demo','admin','Admin#2026!'));
  const docs=[db.users[0],db.users[1]];
  SPECS.forEach((s,i)=>{
    const dob=new Date(new Date(now).getFullYear()-s.age,3,10+Math.floor(rnd()*60));
    const p={id:uid(),mrn:'PT-'+String(101+i).padStart(6,'0'),first:s.first,last:s.last,dob:isoDate(dob),sex:s.sex,phone:'+91 98'+String(Math.floor(10000000+rnd()*89999999)),email:(s.first+'.'+s.last).toLowerCase()+'@example.test',address:'',pmh:s.pmh,fh:s.fh,sh:s.sh,allergyStatus:s.als,ckd:s.ckd,version:1,deletedAt:null,createdAt:new Date(now-400*DAY).toISOString()};
    db.patients.push(p);
    s.al.forEach(a=>db.allergies.push({id:uid(),patientId:p.id,allergen:a[0],reaction:a[1],severity:a[2]}));
    s.c.forEach(c=>db.conditions.push({id:uid(),patientId:p.id,icd10:c[0],desc:c[1],category:c[2],isPrimary:!!c[3],status:'active',onset:isoDate(now-c[4]*365*DAY),sourceEncounterId:null,deletedAt:null}));
    s.m.forEach(m=>db.meds.push({id:uid(),patientId:p.id,name:m[0],dose:m[1],route:m[2],freq:m[3],start:isoDate(now-m[4]*DAY),end:m[5]!=null?isoDate(now-m[5]*DAY):null,status:'active'}));
    s.e.forEach((e,j)=>{const d=new Date(now-e[0]*DAY);d.setHours(10,15,0,0);
      db.encounters.push({id:uid(),patientId:p.id,date:d.toISOString(),type:e[1],clinician:docs[(i+j)%2].name,cc:e[2],symptoms:e[3],exam:e[4],assessment:e[5],plan:e[6],followUp:e[9]?isoDate(d.getTime()+e[9]*DAY):'',status:e[8],vitals:e[7]?{sys:e[7][0],dia:e[7][1],hr:e[7][2],temp:e[7][3],wt:e[7][4]}:null,diagnoses:e[5]?[{icd:s.c[0]?s.c[0][0]:'',desc:s.c[0]?s.c[0][1]:'',condId:null}]:[],version:1,deletedAt:null})});
    const L=s.L;if(L){
      for(let k=0;k<L.n;k++){
        const f=L.n===1?1:k/(L.n-1),ms=now-(L.last+L.span*(1-f))*DAY;
        let eg=k===0?L.e0:k===L.n-1?L.e1:Math.round(L.e0+(L.e1-L.e0)*f+(rnd()-.5)*3);
        const age=(ms-dob.getTime())/(365.25*DAY),scr=creatFromEgfr(eg,age,p.sex);
        const rep={id:uid(),patientId:p.id,collectedAt:new Date(ms).toISOString(),labName:'Metro Diagnostics Laboratory',notes:'',enteredBy:db.users[0].id,createdAt:new Date(ms).toISOString()};
        db.labReports.push(rep);
        const add=(t,v,orig)=>{const r=rangeFor(t,p.sex);const o=orig||{v,u:LAB_TESTS[t].canon};db.labResults.push({id:uid(),reportId:rep.id,patientId:p.id,collectedAt:rep.collectedAt,test:t,value:v,unit:LAB_TESTS[t].canon,valueOriginal:o.v,unitOriginal:o.u,refLow:r.low,refHigh:r.high,flag:flagFor(v,r)})};
        const egRep=k===L.n-1&&L.bump?eg+L.bump:eg;
        add('CREAT',scr,L.conv===k?{v:Math.round(scr/0.0113),u:'µmol/L'}:null);
        add('EGFR',egRep);
        add('BUN',Math.max(6,Math.round((10+(scr-0.9)*14+(rnd()-.5)*3)*10)/10));
        const kv=k===L.n-1&&L.Kl?L.Kl:Math.round((L.K+(rnd()-.5)*.4)*10)/10;
        add('K',kv);add('HB',Math.round((L.HB+(rnd()-.5)*.6)*10)/10);add('CA',Math.round((L.CA+(rnd()-.5)*.4)*10)/10);add('PHOS',Math.round((L.PHOS+(rnd()-.5)*.5)*10)/10);
        if(k%2===0||k===L.n-1)add('UACR',Math.round(L.UACR*(.85+rnd()*.3)));
      }
    }
  });
  return db;
}

async function api(service,method,path,fn,o={}){

  if(err)throw err;return out;
}

function gapEngine(p,age,latest,res,trends,ckd){
  const g=[],add=(code,sev,kind,message,refs)=>g.push({code,sev,kind,message,refs:refs||[]});
  const conds=condsOf(p.id),encs=encsOf(p.id),meds=medsOf(p.id),now=Date.now();
  if(p.allergyStatus==='unknown')add('ALLERGY_STATUS_UNKNOWN','medium','missing','Allergy status has not been recorded. "Unknown" is not the same as "no known allergies".');
  if(!conds.some(c=>c.isPrimary&&c.status==='active'))add('NO_PRIMARY_DIAGNOSIS','medium','missing','No active primary diagnosis is recorded.');
  if(!meds.length)add('NO_MEDICATIONS_DOCUMENTED','low','missing','No medications are documented, so "takes none" cannot be told apart from "not recorded".');
  if(!res.length)add('NO_LABS_RECORDED','high','missing','No laboratory results are on record for this patient.');
  else{
    const days=Math.round((now-new Date(res[0].collectedAt))/DAY);
    if(days>180)add('NO_RECENT_LABS','medium','missing',`The most recent lab result is ${days} days old (threshold 180 days).`,['lab:'+res[0].test+':'+isoDate(res[0].collectedAt)]);
    ['CREAT','EGFR','UACR'].forEach(t=>{if(!latest[t])add('NO_LABS_FOR_TEST','low','missing',`${LAB_TESTS[t].name} has never been recorded.`)});
    if(trends.EGFR.n>0&&trends.EGFR.n<3)add('INSUFFICIENT_TREND_DATA','low','missing',`Only ${trends.EGFR.n} eGFR result${trends.EGFR.n>1?'s':''} on record; a trend needs at least 3.`);
  }
  encs.filter(e=>e.status==='final').forEach(e=>{
    if(!hasVitals(e))add('ENCOUNTER_NO_VITALS','low','missing',`Final encounter on ${fmtDate(e.date)} has no vitals recorded.`,['enc:'+sid(e.id)]);
    if(!e.assessment||!e.plan)add('ENCOUNTER_NO_ASSESSMENT','medium','missing',`Final encounter on ${fmtDate(e.date)} is missing an assessment or plan.`,['enc:'+sid(e.id)]);
  });
  const low=res.filter(r=>r.test==='EGFR'&&r.value<60).sort((a,b)=>new Date(a.collectedAt)-new Date(b.collectedAt));
  if(!p.ckd&&latest.EGFR&&latest.EGFR.value<60&&low.length>=2&&(new Date(low[low.length-1].collectedAt)-new Date(low[0].collectedAt))>=90*DAY)
    add('NO_ESTABLISHED_CKD_STAGE','medium','missing',`eGFR has been below 60 for over 3 months but no established CKD stage is recorded.`,['lab:EGFR:'+isoDate(low[0].collectedAt)]);
  if(ckd.mismatch)add('CKD_STAGE_MISMATCH','high','inconsistent',`Established CKD stage ${ckd.established} does not match the eGFR category of the latest result (${ckd.egfrCat}, eGFR ${fmtVal('EGFR',ckd.egfrVal)}).`,['lab:EGFR:'+isoDate(ckd.egfrDate)]);
  if(latest.EGFR&&latest.CREAT&&latest.EGFR.reportId===latest.CREAT.reportId){
    const calc=ckdEpi(latest.CREAT.value,ageOf(p.dob,latest.EGFR.collectedAt),p.sex);
    if(Math.abs(calc-latest.EGFR.value)>12)add('EGFR_CREATININE_DISCORDANT','medium','inconsistent',`Reported eGFR ${latest.EGFR.value} differs from the CKD-EPI 2021 estimate (${Math.round(calc)}) computed from creatinine ${fmtVal('CREAT',latest.CREAT.value)} mg/dL.`,['lab:EGFR:'+isoDate(latest.EGFR.collectedAt),'lab:CREAT:'+isoDate(latest.CREAT.collectedAt)]);
  }
  const c=trends.CREAT,e=trends.EGFR;
  if(c.n>=3&&e.n>=3&&((c.direction==='improving'&&e.direction==='worsening')||(c.direction==='worsening'&&e.direction==='improving')))add('DIRECTION_CONTRADICTION','medium','inconsistent','Creatinine and eGFR are trending in clinically incompatible directions.');
  meds.filter(m=>m.status==='active'&&m.end&&new Date(m.end)<now).forEach(m=>add('ACTIVE_MED_PAST_END_DATE','low','inconsistent',`${m.name} is marked active but its end date (${fmtDate(m.end)}) has passed.`,['med:'+sid(m.id)]));
  res.forEach(r=>{const t=new Date(r.collectedAt);if(t>now||t<new Date(p.dob))add('LAB_DATE_INVALID','high','inconsistent',`A ${LAB_TESTS[r.test].name} result has an impossible collection date.`)});
  const o={high:0,medium:1,low:2};return g.sort((a,b)=>o[a.sev]-o[b.sev]);
}
function analyze(id){
  const p=P(id),age=ageOf(p.dob),latest=latestByTest(id),res=resultsOf(id);
  const series=t=>res.filter(r=>r.test===t).sort((a,b)=>new Date(a.collectedAt)-new Date(b.collectedAt)).map(r=>({t:new Date(r.collectedAt).getTime(),v:r.value,flag:r.flag,id:r.id}));
  const trends={CREAT:trendStats(series('CREAT'),'CREAT'),EGFR:trendStats(series('EGFR'),'EGFR')};
  const eg=latest.EGFR,ua=latest.UACR;
  const ckd={established:p.ckd||null,egfrCat:eg?classifyEgfr(eg.value):null,egfrVal:eg?eg.value:null,egfrDate:eg?eg.collectedAt:null,uacrCat:ua?classifyUacr(ua.value):null,uacrVal:ua?ua.value:null,uacrDate:ua?ua.collectedAt:null};
  ckd.mismatch=!!(p.ckd&&eg&&ckd.egfrCat!==p.ckd);
  const gaps=gapEngine(p,age,latest,res,trends,ckd),abnormal=Object.values(latest).filter(r=>r.flag!=='normal');
  const critical=abnormal.some(r=>r.flag.indexOf('critical')===0);
  return{p,age,latest,res,trends,ckd,gaps,abnormal,critical,rapid:!!trends.EGFR.rapid,attention:critical||!!trends.EGFR.rapid||gaps.some(x=>x.sev==='high')};
}

function listPatients(L){

  if(q)rows=rows.filter(r=>r.p.mrn.toLowerCase().includes(q)||fullName(r.p).toLowerCase().includes(q)||(r.p.last+' '+r.p.first).toLowerCase().includes(q));
  if(L.sex)rows=rows.filter(r=>r.p.sex===L.sex);
  if(L.stage)rows=rows.filter(r=>L.stage==='none'?!r.p.ckd:r.p.ckd===L.stage);
  if(L.attention)rows=rows.filter(r=>r.a.attention);
  const key={name:r=>(r.p.last+r.p.first).toLowerCase(),mrn:r=>r.p.mrn,age:r=>r.age,dx:r=>r.dx.toLowerCase(),egfr:r=>r.egfr==null?1e9:r.egfr,visit:r=>r.visit?new Date(r.visit).getTime():0}[L.sort]||(r=>r.p.mrn);
  rows.sort((a,b)=>{const x=key(a),y=key(b);return(x<y?-1:x>y?1:0)*L.dir});

  <div class="f-row">${fld('Date of birth',`<input type="date" name="dob" max="${isoDate(Date.now())}" value="${v.dob||''}">`,{req:1,name:'dob',hint:'Age is calculated from this date.'})}${fld('Sex',`<select name="sex">${['M','F','O'].map(s=>`<option value="${s}" ${v.sex===s?'selected':''}>${sexLabel(s)}</option>`).join('')}</select>`,{req:1,name:'sex'})}</div>
  <div class="f-row">${fld('Phone',`<input name="phone" value="${esc(v.phone||'')}" placeholder="+91 98xxxxxxxx">`,{name:'phone'})}${fld('Email',`<input name="email" type="email" value="${esc(v.email||'')}">`,{name:'email'})}</div>
  ${fld('Address',`<input name="address" value="${esc(v.address||'')}">`,{name:'address'})}
  ${fld('Past medical history',`<textarea name="pmh">${esc(v.pmh||'')}</textarea>`,{name:'pmh'})}
  <div class="f-row">${fld('Family history',`<textarea name="fh">${esc(v.fh||'')}</textarea>`,{name:'fh'})}${fld('Social history',`<textarea name="sh">${esc(v.sh||'')}</textarea>`,{name:'sh'})}</div>
  ${p?'':fld('Allergy status',`<select name="als"><option value="unknown">Unknown (not yet asked)</option><option value="nka">No known allergies</option></select>`,{name:'als',hint:'Add specific allergies from the chart after registering.'})}
  <div class="form-actions"><button type="button" class="btn" data-act="close-modal">Cancel</button><button class="btn primary" type="submit">${p?'Save changes':'Register patient'}</button></div></form>`;
}
actions['new-patient']=()=>openModal({title:'Register new patient',sub:'Synthetic data only. Do not enter real patient information.',body:patientForm(),size:'lg'});

forms.patient=async(f,ev)=>{
  const fd=new FormData(f),v=k=>(fd.get(k)||'').trim(),errs={},editId=f.dataset.id;
  if(!v('first'))errs.first='First name is required.';if(!v('last'))errs.last='Last name is required.';
  if(!v('dob'))errs.dob='Date of birth is required.';else if(new Date(v('dob'))>new Date())errs.dob='Date of birth cannot be in the future.';else if(ageOf(v('dob'))>120)errs.dob='Check the date of birth. Age would exceed 120.';
  if(v('email')&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v('email')))errs.email='Enter a valid email address.';
  if(v('phone')&&!/^[+0-9 ()-]{7,20}$/.test(v('phone')))errs.phone='Use digits, spaces and + only (7 to 20 characters).';
  if(showErrors(f,errs))return;
  const btn=ev.submitter;setLoading(btn,true);
  try{
    if(editId){
      await api('patient','PATCH',`/patients/${sid(editId)}`,()=>{clin();const p=P(editId);if(p.version!==+f.dataset.version)throw new ApiError(409,'VERSION_CONFLICT','This record was changed by someone else. Reload and try again.');Object.assign(p,{first:v('first'),last:v('last'),dob:v('dob'),sex:v('sex'),phone:v('phone'),email:v('email'),address:v('address'),pmh:v('pmh'),fh:v('fh'),sh:v('sh')});p.version++;audit('update patient',p.id);save()});
      closeModal();toast('Patient details saved.');render();
    }else{
      const np=await api('patient','POST','/patients',()=>{clin();const n=Math.max(...db.patients.map(p=>+p.mrn.slice(3)))+1;const p={id:uid(),mrn:'PT-'+String(n).padStart(6,'0'),first:v('first'),last:v('last'),dob:v('dob'),sex:v('sex'),phone:v('phone'),email:v('email'),address:v('address'),pmh:v('pmh'),fh:v('fh'),sh:v('sh'),allergyStatus:v('als')||'unknown',ckd:null,version:1,deletedAt:null,createdAt:new Date().toISOString()};db.patients.push(p);audit('create patient',p.id);save();return p});
      closeModal();toast(`Patient ${np.mrn} registered.`);location.hash='#/patients/'+np.id+'/overview';
    }
  }catch(e){setLoading(btn,false);const g=$('[data-gen]',f);if(g)g.innerHTML=`<div class="alert danger" style="margin-bottom:12px">${ic('alert',16)}<div>${esc(e.message)}</div></div>`}
};

  const cs=condsOf(id),sect=(title,cat)=>{const rows=cs.filter(c=>c.category===cat);return `<div class="panel" style="margin-bottom:14px"><div class="panel-h"><h2>${title}</h2><span class="muted small">${rows.length} recorded</span></div>${rows.length?`<table><thead><tr><th>ICD-10</th><th>Description</th><th>Onset</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(c=>`<tr><td class="mono">${esc(c.icd10||'-')}</td><td>${esc(c.desc)} ${c.isPrimary?chip('Primary','teal','star'):''}</td><td>${fmtDate(c.onset)}</td><td>${chip(c.status==='active'?'Active':'Resolved',c.status==='active'?'warn':'ok')}</td><td class="num nowrap">${c.status==='active'&&!c.isPrimary?`<button class="btn sm" data-act="set-primary" data-id="${c.id}">Set as primary</button> `:''}<button class="btn sm ghost" data-act="toggle-cond" data-id="${c.id}">${c.status==='active'?'Mark resolved':'Reactivate'}</button></td></tr>`).join('')}</tbody></table>`:`<div class="empty">None recorded.</div>`}</div>`};
  return `<div class="panel" style="margin-bottom:14px"><div class="panel-b"><div class="row" style="justify-content:space-between"><div class="row" style="gap:18px"><label class="fld" style="margin:0"><span class="fld-l">Established CKD stage</span><select class="inp sm" data-change="ckd-stage" style="min-width:180px"><option value="">Not set</option>${['G1','G2','G3a','G3b','G4','G5'].map(s=>`<option ${a.p.ckd===s?'selected':''}>${s}</option>`).join('')}</select></label>
  <div><div class="fld-l">eGFR category of latest result</div><div style="margin-top:6px">${a.ckd.egfrCat?chip(a.ckd.egfrCat+' ('+egfrLabel(a.ckd.egfrCat)+')','teal'):'<span class="nd">No eGFR on record</span>'}</div></div></div><button class="btn primary" data-act="add-condition">${ic('plus',16)}Add condition</button></div>

}

const niceStep=r=>{const p=Math.pow(10,Math.floor(Math.log10(r))),f=r/p;return(f<=1?1:f<=2?2:f<=5?5:10)*p};
function lineChart(o){
  if(!o.pts.length)return `<div class="empty">No ${o.name} results in this period.</div>`;
  const W=640,H=270,m={l:48,r:o.stage?64:22,t:16,b:32};
  let tmin=o.pts[0].t,tmax=o.pts[o.pts.length-1].t;if(tmax-tmin<30*DAY){tmin-=15*DAY;tmax+=15*DAY}
  const vals=o.pts.map(p=>p.v);let ymin=Math.min(...vals,o.low==null?Infinity:o.low),ymax=Math.max(...vals,o.high==null?-Infinity:o.high);
  if(o.stage){ymin=0;ymax=Math.max(ymax,100)}else{const pd=(ymax-ymin||1)*.18;ymin=Math.max(0,ymin-pd);ymax+=pd}
  const step=niceStep((ymax-ymin)/4),ticks=[];for(let t=Math.floor(ymin/step)*step;t<=ymax+step*.01;t+=step)ticks.push(Math.round(t*1000)/1000);
  ymin=ticks[0];ymax=ticks[ticks.length-1];
  const sx=t=>m.l+(t-tmin)/(tmax-tmin)*(W-m.l-m.r),sy=v=>H-m.b-(v-ymin)/(ymax-ymin)*(H-m.t-m.b),dec=LAB_TESTS[o.test].dec;
  const yTop=sy(Math.min(o.high==null?ymax:o.high,ymax)),yBot=sy(Math.max(o.low==null?ymin:o.low,ymin));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.name)} over time. ${o.pts.length} results. Latest ${fmtVal(o.test,o.pts[o.pts.length-1].v)} ${o.unit}.">`;
  s+=`<g class="ax">${ticks.map(t=>`<line class="grid-l" x1="${m.l}" x2="${W-m.r}" y1="${sy(t)}" y2="${sy(t)}"/><text x="${m.l-8}" y="${sy(t)+4}" text-anchor="end">${+t.toFixed(dec+1)}</text>`).join('')}`;
  for(let i=0;i<5;i++){const t=tmin+(tmax-tmin)*i/4;s+=`<text x="${sx(t)}" y="${H-10}" text-anchor="middle">${new Date(t).toLocaleDateString('en-GB',{month:'short',year:'2-digit'})}</text>`}
  s+=`<text x="${m.l}" y="11" style="font-weight:500">${esc(o.unit)}</text></g>`;
  if(o.high!=null||o.low!=null)s+=`<rect class="band" x="${m.l}" y="${Math.min(yTop,yBot)}" width="${W-m.l-m.r}" height="${Math.abs(yBot-yTop)}"/>`;
  if(o.stage){[[90,100,'G1'],[60,90,'G2'],[45,60,'G3a'],[30,45,'G3b'],[15,30,'G4'],[0,15,'G5']].forEach(b=>{if(b[0]>0&&b[0]<ymax)s+=`<line class="stage-l" x1="${m.l}" x2="${W-m.r}" y1="${sy(b[0])}" y2="${sy(b[0])}"/>`;const c=(Math.max(b[0],ymin)+Math.min(b[1],ymax))/2;s+=`<text class="stage-t" x="${W-m.r+6}" y="${sy(c)+4}">${b[2]}</text>`})}
  s+=`<path class="series" d="${o.pts.map((p,i)=>(i?'L':'M')+sx(p.t).toFixed(1)+' '+sy(p.v).toFixed(1)).join(' ')}"/>`;
  o.pts.forEach((p,i)=>{const x=sx(p.t),y=sy(p.v),tip=`<b>${fmtVal(o.test,p.v)} ${o.unit}</b><br>${FLAG[p.flag]?FLAG[p.flag][0]:''}<br>${fmtDate(p.t)}`;
    s+=`<g class="hp" data-tip="${esc(tip)}"><line class="xhair" x1="${x}" x2="${x}" y1="${m.t}" y2="${H-m.b}"/><circle r="14" cx="${x}" cy="${y}" fill="transparent"/><circle class="pt" r="5" cx="${x}" cy="${y}" fill="${flagColor(p.flag)}"/></g>`;
    if(i===o.pts.length-1)s+=`<text x="${x}" y="${y-12}" text-anchor="${x>W-90?'end':'middle'}" style="font-size:12px;font-weight:600;fill:#10202b">${fmtVal(o.test,p.v)}</text>`});
  return s+`</svg>`;
}
const LABRANGE={'6m':182,'1y':365,'2y':730};
async function tabLabs(id){
  const L=ui.labs,cut=LABRANGE[L.range]?Date.now()-LABRANGE[L.range]*DAY:0;
  const [a,res,tr]=await Promise.all([

    api('lab','GET',`/labs/patients/${sid(id)}/results?test=${L.test}&page=${L.page}`,()=>{clin();return resultsOf(id).filter(r=>new Date(r.collectedAt)>=cut)}),
    api('lab','GET',`/labs/patients/${sid(id)}/trends?tests=CREAT,EGFR`,()=>{clin();const out={};['CREAT','EGFR'].forEach(t=>{const pts=resultsOf(id).filter(r=>r.test===t&&new Date(r.collectedAt)>=cut).sort((x,y)=>new Date(x.collectedAt)-new Date(y.collectedAt)).map(r=>({t:new Date(r.collectedAt).getTime(),v:r.value,flag:r.flag}));out[t]=trendStats(pts,t)});return out})]);
  const p=a.p,ck=a.ckd;let rows=res.filter(r=>(L.test==='ALL'||r.test===L.test)&&(!L.abn||r.flag!=='normal'));
  const per=10,pages=Math.max(1,Math.ceil(rows.length/per));L.page=Math.min(L.page,pages);
  const chartCard=(t,o)=>{const s=tr[t],T=LAB_TESTS[t],rg=rangeFor(t,p.sex);return `<div class="panel"><div class="panel-h"><h3>${T.name} trend</h3><span class="muted small">Reference ${refText(rg)} ${T.canon}</span></div><div class="chart-wrap">${lineChart({pts:s.pts||[],low:rg.low,high:rg.high,unit:T.canon,test:t,name:T.name,stage:o})}</div>
  ${s.n?`<div class="stat-row">${dirChip(s)}${s.n>=2?chip(`Change ${signed(s.abs,T.dec)} (${signed(s.pct,0)}%)`):''}${s.slope!=null?chip(`${signed(s.slope,t==='EGFR'?1:2)} per year`):''}${s.rapid?chip('Rapid decline','danger','alert'):''}</div>`:''}</div>`};
  return `<div class="ckd-grid"><div class="ckd-cell"><div class="t">Established CKD stage (clinician)</div><div class="v">${p.ckd||'<span class="nd" style="font-size:16px;font-weight:400">Not set</span>'}</div><div class="small muted">Recorded on the Conditions tab</div></div>

  let d,ctx,hash,out=null,tools=[],attempts=1,errCode=null,status='completed',v=null,cachedHit=null;
  try{
    setS(0,'active');await sleep(260);clin();
    const today=isoDate(Date.now());
    if(db.aiSummaries.filter(s=>s.requestedBy===session.user.id&&isoDate(s.createdAt)===today).length>=cfg.dailyQuota)throw new ApiError(429,'AI_QUOTA_EXCEEDED','You have reached the daily limit for AI summaries.');
    setS(0,'done','Ready');
    setS(1,'active');
    await Promise.all([api('patient','GET',`/internal/patients/${sid(pid)}/chart`,()=>({ok:1}),{from:'ai',delay:220}),api('lab','GET',`/internal/labs/patients/${sid(pid)}/summary`,()=>{if(sim==='upstream')throw new ApiError(503,'UPSTREAM_UNAVAILABLE','Lab results could not be loaded in time.');return{ok:1}},{from:'ai',delay:280})]);
    setS(1,'done','Done');
    setS(2,'active');await sleep(320);d=analyze(pid);setS(2,'done',`${d.gaps.length} rule findings, ${d.abnormal.length} abnormal latest results`);
    setS(3,'active');await sleep(240);ctx=buildContext(d);hash=hash53(JSON.stringify(ctx)+cfg.provider+'v1').slice(0,12);
    cachedHit=!force&&db.aiSummaries.find(s=>s.patientId===pid&&s.status==='completed'&&s.contextHash===hash);
    if(cachedHit){setS(3,'done','Same data as an earlier summary');[4,5,6].forEach(i=>setS(i,'skipped','Not needed, reusing the saved summary'))}
    else{
      setS(3,'done','New or changed data');
      setS(4,'active','Sending the chart summary to the AI');
      try{
        if(sim==='ratelimit'){await sleep(520);throw degrade('LLM_RATE_LIMITED','The AI service is busy right now. Try again in a minute.')}
        if(sim==='timeout'){await sleep(650);setS(4,'active','No answer yet, trying again');await sleep(750);throw degrade('LLM_TIMEOUT','The AI service did not answer in time. Try again in a minute.')}
        if(toolsOn){const plan=toolPlan(d,pid).slice(0,cfg.maxToolIterations+2);for(let i=0;i<plan.length;i++){const tc=plan[i];setS(4,'active',`Looking up ${tc.name.replace(/^get_/,'').replace(/_/g,' ')} ${tc.argsShort}`);const t1=performance.now();const res=await api(tc.service,'GET',tc.path,()=>tc.run(),{from:'ai',delay:130+Math.random()*120});tools.push({seq:i+1,name:tc.name,args:tc.args,service:tc.service,bytes:JSON.stringify(res).length,ms:Math.round(performance.now()-t1),status:'ok'})}}
        await sleep(520);out=buildNarrative(d);setS(4,'done','Draft ready');
        setS(5,'active','Checking the format');await sleep(380);
        if(sim==='invalid'){setS(5,'active','The first answer was incomplete. Asking the AI to correct it');attempts=2;await sleep(1000)}
        v=validateOutput(out,pid);setS(5,'done',`${v.refsOk} of ${v.refsTotal} sources found in the record${attempts>1?', corrected after one retry':''}`);
      }catch(e){if(!e.degrade)throw e;status='degraded';errCode=e.degrade;out=null;setS(4,'warn',e.message);setS(5,'skipped','Nothing to check')}
      setS(6,'active');await sleep(220);
    }
    let rec=cachedHit;
    if(!rec){
      const tin=Math.round(JSON.stringify(ctx).length/4)+620+tools.reduce((a,t)=>a+t.bytes/4,0|0),tout=out?Math.round(JSON.stringify(out).length/4):0;
      rec={id:uid(),patientId:pid,requestedBy:session.user.id,status,provider:cfg.provider,model:MODEL[cfg.provider],promptVersion:'v1',contextHash:hash,contextSnapshot:ctx,output:out,facts:factsOf(d),gaps:d.gaps,toolCalls:tools,attempts,latencyMs:Math.round(performance.now()-T0),tokensIn:Math.round(tin),tokensOut:tout,errorCode:errCode,validation:v,createdAt:new Date().toISOString()};
      db.aiSummaries.unshift(rec);save();setS(6,'done','Saved');
    }
    rec.pipeline=rec.pipeline||S.steps.map(s=>({t:s.t,st:s.st,ms:s.ms,note:s.note}));
    S.status='done';ui.ai.openId=rec.id;
    logCall({service:'ai',method:'POST',path:`/api/ai/patients/${sid(pid)}/summary${force?'?force=true':''}`,status:200,ms:Math.round(performance.now()-T0)});
    renderAiPane();
    toast(cachedHit?'Nothing has changed since the last summary, so the saved one is shown.':status==='degraded'?'Summary is partial: the AI narrative is unavailable.':'AI summary generated.',cachedHit?'info':status==='degraded'?'info':'ok');
  }catch(e){
    const i=S.steps.findIndex(s=>s.st==='active');if(i>=0){S.steps[i].st='failed';S.steps[i].note=e.message;if(S.steps[i].t0){S.steps[i].ms=Math.round(performance.now()-S.steps[i].t0)}}
    S.status='error';S.error=e;logCall({service:'ai',method:'POST',path:`/api/ai/patients/${sid(pid)}/summary`,status:e.status||500,code:e.code,ms:Math.round(performance.now()-T0)});renderAiPane();
  }finally{setBusy('gw',-1);setBusy('ai',-1)}
}

/* ================= shared chart helpers ================= */
function spark(s){
  if(!s||s.n<2)return '<span class="nd">-</span>';
  const W=86,H=26,pts=s.pts,t0=pts[0].t,t1=pts[pts.length-1].t,vs=pts.map(p=>p.v),lo=Math.min(...vs),hi=Math.max(...vs),rg=(hi-lo)||1;
  const x=t=>3+(t-t0)/((t1-t0)||1)*(W-6),y=v=>H-4-(v-lo)/rg*(H-8);
  const col=s.direction==='worsening'?'#be2f3b':s.direction==='improving'?'#12805c':'#6b7f89';
  const last=pts[pts.length-1];
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" data-tip="eGFR ${fmtVal('EGFR',s.first)} to ${fmtVal('EGFR',s.last)}<br>${s.n} results, ${esc(s.direction)}" role="img" aria-label="eGFR trend, ${s.direction}"><path d="${pts.map((p,i)=>(i?'L':'M')+x(p.t).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ')}" fill="none" stroke="${col}" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(last.t).toFixed(1)}" cy="${y(last.v).toFixed(1)}" r="2.6" fill="${col}"/></svg>`;
}
function kidneyPanel(a,id){
  const ck=a.ckd,mk=(t,stage)=>{const s=a.trends[t],T=LAB_TESTS[t],rg=rangeFor(t,a.p.sex);
    return `<div><div class="kf-h"><b>${T.name}</b><span class="muted small">${s.n?`Latest <b class="mono" style="color:var(--ink)">${fmtVal(t,s.last)}</b> ${T.canon}, ${fmtDate(s.pts[s.n-1].t)}`:'No results yet'}</span></div>${lineChart({pts:s.pts||[],low:rg.low,high:rg.high,unit:T.canon,test:t,name:T.name,stage})}${s.n?`<div class="stat-row">${dirChip(s)}${s.n>=2?chip(`Change ${signed(s.abs,T.dec)} (${signed(s.pct,0)}%)`):''}${s.slope!=null?chip(`${signed(s.slope,t==='EGFR'?1:2)} per year`):''}${s.rapid?chip('Rapid decline','danger','alert'):''}</div>`:''}</div>`};
  return `<div class="panel" style="margin-bottom:16px"><div class="panel-h"><h2>${ic('activity',18)}Kidney function</h2><a href="#/patients/${id}/labs" class="small">All lab results</a></div><div class="panel-b">
  <div class="ckd-strip"><div><div class="k">Established CKD stage</div>${stageChip(a.p.ckd)}</div><div><div class="k">eGFR category, latest result</div>${ck.egfrCat?chip(ck.egfrCat+' ('+egfrLabel(ck.egfrCat)+')','teal'):'<span class="nd">No eGFR on record</span>'}</div><div><div class="k">Albuminuria category (UACR)</div>${ck.uacrCat?chip(ck.uacrCat+' ('+uacrLabel(ck.uacrCat)+')','teal'):'<span class="nd">No UACR on record</span>'}</div>${ck.mismatch?`<div>${chip('Established stage differs from latest eGFR','warn','alert')}</div>`:''}</div>
  <div class="grid g2">${mk('EGFR',true)}${mk('CREAT',false)}</div></div></div>`;

async function viewDashboard(tok){
  ui.cur={pid:null,tab:null};$('#view').innerHTML=skeleton();
  try{
    const D=await api('patient','GET','/dashboard',()=>{clin();
      const all=db.patients.filter(p=>!p.deletedAt).map(p=>analyze(p.id)),today=isoDate(Date.now());
      const drafts=db.encounters.filter(e=>e.status==='draft'&&!e.deletedAt).sort((a,b)=>new Date(b.date)-new Date(a.date));

      const abn=[];all.forEach(a=>Object.values(a.latest).filter(r=>r.flag!=='normal').sort((x,y)=>(y.flag.indexOf('critical')===0)-(x.flag.indexOf('critical')===0)).slice(0,2).forEach(r=>abn.push(r)));abn.sort((x,y)=>((y.flag.indexOf('critical')===0)-(x.flag.indexOf('critical')===0))||new Date(y.collectedAt)-new Date(x.collectedAt));

        a.abnormal.filter(r=>r.flag.indexOf('critical')===0).forEach(r=>why.push(['danger',`Critical ${LAB_TESTS[r.test].name.toLowerCase()} ${fmtVal(r.test,r.value)} ${r.unit}`]));
        if(a.rapid)why.push(['danger',`eGFR falling ${Math.abs(a.trends.EGFR.slope).toFixed(1)} per year`]);
        a.gaps.filter(g=>g.sev==='high').slice(0,2).forEach(g=>why.push(['warn',g.message.replace(/\.$/,'')]));
        return{a,why,crit:a.critical?0:a.rapid?1:2}}).sort((x,y)=>x.crit-y.crit);
      const dist={G1:0,G2:0,G3a:0,G3b:0,G4:0,G5:0,none:0};all.forEach(a=>dist[a.ckd.egfrCat||'none']++);
      return{all,att,drafts,follow,abn,dist,crit:all.filter(a=>a.critical).length,rapid:all.filter(a=>a.rapid).length}});
    if(tok!==ui.tok)return;
    const h=new Date().getHours(),hi=h<12?'Good morning':h<17?'Good afternoon':'Good evening',nm='Dr. '+session.user.name.split(' ').pop();
    const pn=id=>{const p=db.patients.find(x=>x.id===id);return p?fullName(p):'Unknown'};
    const maxD=Math.max(1,...Object.values(D.dist));
    $('#view').innerHTML=`<div class="page-h"><div><h1 class="greet">${hi}, ${esc(nm)}</h1><p>${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p></div><div class="row"><a class="btn" href="#/patients" style="text-decoration:none">${ic('users',16)}All patients</a><button class="btn primary" data-act="new-patient">${ic('plus',16)}New patient</button></div></div>
    <div class="kpis"><div class="kpi"><div class="n">${D.all.length}</div><div class="l">Patients</div></div><div class="kpi ${D.att.length?'hot':''}"><div class="n">${D.att.length}</div><div class="l">Need attention</div></div><div class="kpi"><div class="n">${D.crit}</div><div class="l">With critical results</div></div><div class="kpi"><div class="n">${D.rapid}</div><div class="l">Rapid eGFR decline</div></div><div class="kpi"><div class="n">${D.drafts.length}</div><div class="l">Draft encounters</div></div></div>
    <div class="grid g-main" style="margin-bottom:16px;align-items:start">
    <div class="panel"><div class="panel-h"><h2>${ic('alert',18)}Needs your attention</h2><span class="muted small">${D.att.length} patient${D.att.length===1?'':'s'}</span></div>${D.att.length?D.att.slice(0,6).map(x=>`<div class="att-item"><div><b>${esc(fullName(x.a.p))}</b> <span class="muted small">${x.a.p.mrn}, ${x.a.age} years</span><div class="why">${x.why.map(w=>chip(w[1],w[0])).join('')}</div></div><a class="btn sm" href="#/patients/${x.a.p.id}/overview" style="text-decoration:none">Open chart</a></div>`).join(''):`<div class="empty">${ic('check',24)}<b>Nothing urgent</b>No critical results, rapid declines or high-priority record gaps.</div>`}</div>
    <div class="panel"><div class="panel-h"><h2>${ic('activity',18)}Patients by eGFR category</h2><span class="muted small">Latest result</span></div><div class="panel-b">${['G1','G2','G3a','G3b','G4','G5'].map(k=>`<div class="hbar" data-tip="${D.dist[k]} patient${D.dist[k]===1?'':'s'} in ${k}: ${egfrLabel(k)}"><span>${k} <span class="muted small">${egfrLabel(k).split(',')[0]}</span></span><div class="track"><div class="fill" style="width:${D.dist[k]/maxD*100}%;background:${STAGE_COL[k]}"></div></div><span class="ct">${D.dist[k]}</span></div>`).join('')}<div class="small muted" style="margin-top:8px">${D.dist.none?`${D.dist.none} patient${D.dist.none===1?' has':'s have'} no eGFR on record. `:''}Categories follow KDIGO eGFR thresholds.</div></div></div></div>
    <div class="grid g2" style="align-items:start"><div class="panel"><div class="panel-h"><h2>${ic('flask',18)}Abnormal results to review</h2></div><table><thead><tr><th>Patient</th><th>Test</th><th class="num">Result</th><th>Flag</th><th>Date</th></tr></thead><tbody>${D.abn.slice(0,8).map(r=>`<tr class="click-row" data-act="goto" data-route="#/patients/${r.patientId}/labs"><td><b>${esc(pn(r.patientId))}</b></td><td class="nowrap">${LAB_TESTS[r.test].name}</td><td class="num mono nowrap">${fmtVal(r.test,r.value)} <span class="muted small">${esc(r.unit)}</span></td><td>${flagChip(r.flag)}</td><td class="nowrap">${fmtDate(r.collectedAt)}</td></tr>`).join('')}</tbody></table></div>
    <div class="grid"><div class="panel"><div class="panel-h"><h2>${ic('calendar',18)}Upcoming follow-ups</h2></div>${D.follow.length?D.follow.slice(0,5).map(e=>`<div class="list-item"><div><b>${esc(pn(e.patientId))}</b><div class="small muted">${esc(e.plan||e.cc||'')}</div></div><div class="row">${chip(fmtDate(e.followUp),'teal')}<a class="btn sm" href="#/patients/${e.patientId}/encounters" style="text-decoration:none">Open</a></div></div>`).join(''):'<div class="empty"><b>No follow-ups scheduled</b>Dates entered in an encounter plan appear here.</div>'}</div>
    <div class="panel"><div class="panel-h"><h2>${ic('file',18)}Draft encounters</h2></div>${D.drafts.length?D.drafts.slice(0,4).map(e=>`<div class="list-item"><div><b>${esc(pn(e.patientId))}</b><div class="small muted">${fmtDate(e.date)}, ${typeLabel(e.type)}</div></div><a class="btn sm" href="#/patients/${e.patientId}/encounters" style="text-decoration:none">Finish</a></div>`).join(''):'<div class="empty"><b>No drafts</b>Every encounter has been finalized.</div>'}</div></div></div>`;
  }catch(e){if(tok===ui.tok)$('#view').innerHTML=errorState(e)}
}

/* ================= start ================= */
load();
if(!session||session.user.role!=='clinician')startSession(db.users.find(u=>u.role==='clinician'));
if(!location.hash||/^#\/(login|signup|system|architecture)/.test(location.hash))location.hash='#/dashboard';
render();
})();
</script>
</body>
</html>
