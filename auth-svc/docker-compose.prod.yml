# Production override:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ENVIRONMENT=production makes auth-svc refuse to start unless the config is safe (see LLD "Production
# hardening"): no demo seed, Secure cookies, no localhost CORS, key file mode 0600, signup off.
services:
  auth-svc:
    environment:
      ENVIRONMENT: production
      SEED_DEMO_USERS: "false"
      ENABLE_PUBLIC_SIGNUP: "false"
      COOKIE_SECURE: "true"
      # No default on purpose: starting without real origins must fail, not fall back to localhost.
      CORS_ALLOWED_ORIGINS: ${PROD_CORS_ALLOWED_ORIGINS:?set PROD_CORS_ALLOWED_ORIGINS to the real https origin(s)}
    # The key file must be owned by uid 10001 with mode 0600 (setup/generate-keys.sh --prod).
