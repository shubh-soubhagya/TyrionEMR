name: auth-svc

on:
  push:
    branches: [main]
    paths: ["auth-svc/**", ".github/workflows/auth-svc.yml"]
  pull_request:
    paths: ["auth-svc/**", ".github/workflows/auth-svc.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: auth-svc

concurrency:
  group: auth-svc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway credentials for the CI-only database service container
      AUTH_DB_PW: ci-only-not-a-secret
      PGPASSWORD: postgres
      AUTH_DATABASE_URL: postgresql+asyncpg://auth_svc:ci-only-not-a-secret@localhost:5432/nephro_auth_db
      AUTH_TEST_DATABASE_URL: postgresql+asyncpg://auth_svc:ci-only-not-a-secret@localhost:5432/nephro_auth_db_test
      JWT_PRIVATE_KEY_PATH: setup/keys/jwt_private.pem
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: auth-svc/requirements-dev.lock

      - name: Install (hash-locked)
        run: |
          pip install --require-hashes --no-deps -r requirements-dev.lock
          pip install --no-deps -e .

      # Same SQL as setup/init-auth-db.sh and setup/init-auth-db-test.sh
      - name: Create role, databases and citext
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -v pw="$AUTH_DB_PW" -d postgres <<'SQL'
          SELECT format('CREATE ROLE auth_svc LOGIN PASSWORD %L', :'pw')
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'auth_svc') \gexec
          ALTER ROLE auth_svc NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION;
          SELECT 'CREATE DATABASE nephro_auth_db OWNER auth_svc ENCODING ''UTF8'' TEMPLATE template0'
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'nephro_auth_db') \gexec
          SELECT 'CREATE DATABASE nephro_auth_db_test OWNER auth_svc ENCODING ''UTF8'' TEMPLATE template0'
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'nephro_auth_db_test') \gexec
          REVOKE CONNECT ON DATABASE nephro_auth_db FROM PUBLIC;
          GRANT  CONNECT ON DATABASE nephro_auth_db TO auth_svc;
          REVOKE CONNECT ON DATABASE nephro_auth_db_test FROM PUBLIC;
          GRANT  CONNECT ON DATABASE nephro_auth_db_test TO auth_svc;
          SQL
          for db in nephro_auth_db nephro_auth_db_test; do
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -d "$db" -c "
              CREATE EXTENSION IF NOT EXISTS citext;
              ALTER SCHEMA public OWNER TO auth_svc;
              REVOKE CREATE ON SCHEMA public FROM PUBLIC;"
          done

      - name: Throwaway signing key
        run: bash setup/generate-keys.sh

      - name: Lint
        run: |
          ruff check app tests migrations
          mypy app

      - name: Tests
        run: pytest -q

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Known-vulnerability scan of the locked dependencies
        run: |
          pip install pip-audit
          pip-audit --require-hashes --disable-pip -r requirements.lock
          pip-audit --require-hashes --disable-pip -r requirements-build.lock

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t nephro/auth-svc:ci .
      - name: Trivy scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: nephro/auth-svc:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library
